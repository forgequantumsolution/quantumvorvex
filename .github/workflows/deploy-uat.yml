# =============================================================================
# Quantum Vorvex — Build & Deploy UAT  (this file lives on `main`)
#
# Builds the `shriyansh/frontend` branch's code into quantumvorvex-uat-* images
# and deploys them to /home/forge/quantumvorvex/uat using docker-compose.uat.yml.
#
# Trigger: manual (Actions -> "Build & Deploy (uat)" -> Run workflow). Run it
# whenever you want to ship the latest shriyansh/frontend code to UAT.
#
# Required secrets: SERVER_HOST, SERVER_USER (forge), SERVER_SSH_KEY.
# =============================================================================

name: Build & Deploy (uat)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-uat
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/quantumvorvex-uat
  CD_PATH: /home/forge/quantumvorvex/uat
  APP_REF: shriyansh/frontend          # the branch whose code UAT runs

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deployment/Dockerfile.Backend
            target: runtime
          - name: frontend
            dockerfile: deployment/Dockerfile.Frontend
            target: runtime
          - name: migrate
            dockerfile: deployment/Dockerfile.Backend
            target: migrate
    steps:
      - name: Checkout UAT app code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_REF }}        # build the shriyansh/frontend code
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=uat-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=uat-${{ matrix.name }}

  deploy:
    name: Deploy to uat
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main — for the uat compose)
        uses: actions/checkout@v4
      - name: Copy uat compose to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.uat.yml
          target: ${{ env.CD_PATH }}
      - name: Pull, migrate, bring up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,CD_PATH
          script_stop: true
          script: |
            set -e
            cd "$CD_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker-compose.uat.yml pull
            docker compose -f docker-compose.uat.yml up -d --wait postgres
            docker compose -f docker-compose.uat.yml run --rm --no-deps migrate
            docker compose -f docker-compose.uat.yml up -d
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          CD_PATH: ${{ env.CD_PATH }}
