# =============================================================================
# Quantum Vorvex — DEMO production stack (pull-only)
#
# Images are pulled from GHCR — they are built + pushed by CI
# (.github/workflows/deploy.yml). This file does NOT build anything.
# Deployed to /home/forge/quantumvorvex/demo on push to `main`.
#
# Secrets live in a .env beside this file (see .env.example).
# The deploy sets IMAGE_TAG=<git sha>; defaults to :latest otherwise.
# =============================================================================

name: quantumvorvex-demo

networks:
  qvnet:
    driver: bridge

volumes:
  pg_data:
  uploads_data:

services:
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [qvnet]
    shm_size: 256mb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/forgequantumsolution/quantumvorvex-demo-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [qvnet]

  # ---------------------------------------------------------------------------
  app:
    image: ghcr.io/forgequantumsolution/quantumvorvex-demo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads_data:/app/uploads
    expose: ["5000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [qvnet]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---------------------------------------------------------------------------
  nginx:
    image: ghcr.io/forgequantumsolution/quantumvorvex-demo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Host nginx terminates TLS and proxies to this localhost port.
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [qvnet]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
