# =============================================================================
# Quantum Vorvex — container nginx (HTTP :80 only)
#
# This file is dropped at /etc/nginx/conf.d/default.conf, REPLACING the stock
# image default. It is included inside the base image's http{} block, so it must
# NOT re-declare main/events/http wrappers or directives the stock nginx.conf
# already sets (sendfile, keepalive_timeout, log_format main, mime.types …) —
# doing so triggers "duplicate directive" errors.
#
# This container is an INTERNAL upstream. The HOST nginx terminates TLS on :443
# and proxies to it (see deployment/host-nginx.sample.conf). So there is
# deliberately NO TLS / certs / HSTS / rate limiting here — those belong on the
# host edge. The domain (server_name) also lives on the host; here we accept any
# Host on :80 and serve the SPA + proxy the API.
#
#   /            -> static React build (SPA fallback to index.html)
#   /assets/     -> static, long-lived immutable cache (Vite-hashed filenames)
#   /api/ /uploads/ /health -> reverse proxy to the Node app
#   /healthz     -> 200 for the container healthcheck
# =============================================================================

server_tokens  off;

# Large enough for hotel image / KYC uploads
client_max_body_size  50m;
client_body_timeout    30s;
client_header_timeout  30s;
send_timeout           30s;

# ── Gzip ────────────────────────────────────────────────────────────────────
gzip               on;
gzip_vary          on;
gzip_proxied       any;
gzip_comp_level    5;
gzip_min_length    256;
gzip_types
    application/json application/javascript application/x-javascript
    text/javascript text/html text/plain text/css text/xml
    image/svg+xml font/woff font/woff2;

# ── Upstream: the Node/Express app container ──────────────────────────────────
upstream app_backend {
    server backend:5000;
    keepalive 32;
}

# Forward the original client info that the host nginx set
proxy_http_version 1.1;
proxy_set_header   Connection         "";
proxy_set_header   Host               $host;
proxy_set_header   X-Real-IP          $remote_addr;
proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto  $http_x_forwarded_proto;
proxy_connect_timeout  10s;
proxy_send_timeout     30s;
proxy_read_timeout     60s;

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container healthcheck (not proxied)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # App health + API + uploaded files -> Node
    location = /health  { proxy_pass http://app_backend; access_log off; }
    location /api/      { proxy_pass http://app_backend; }
    location /uploads/  { proxy_pass http://app_backend; }

    # ── Service worker + index must always revalidate ───────────────────────
    location = /sw.js {
        add_header  Cache-Control  "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header  Cache-Control  "no-cache";
    }

    # ── Hashed assets — cache hard ──────────────────────────────────────────
    location /assets/ {
        expires    1y;
        add_header Cache-Control  "public, immutable";
        try_files  $uri =404;
    }

    # ── SPA — serve static, fall back to index.html for client routes ────────
    location / {
        add_header  Cache-Control  "no-cache";
        try_files   $uri /index.html;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
