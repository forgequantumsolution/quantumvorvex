# =============================================================================
# Quantum Vorvex — UAT production stack (pull-only)
#
# Lives on `main`, but the IMAGES are built from the `shriyansh/frontend` code
# by .github/workflows/deploy-uat.yml. This file only pulls + runs.
# Deployed to /home/forge/quantumvorvex/uat. Use with:
#   docker compose -f docker-compose.uat.yml <cmd>
# Secrets in a .env beside it (POSTGRES_*, JWT_SECRET, CLIENT_URL, EMAIL_*, ...).
# =============================================================================

name: quantumvorvex-uat

networks:
  qvnet:
    driver: bridge

volumes:
  pg_data:
  uploads_data:

services:
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [qvnet]
    shm_size: 256mb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/forgequantumsolution/quantumvorvex-uat-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [qvnet]

  # ---------------------------------------------------------------------------
  app:
    image: ghcr.io/forgequantumsolution/quantumvorvex-uat-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      ENFORCE_SINGLE_SESSION: ${ENFORCE_SINGLE_SESSION:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - uploads_data:/app/server/uploads
    expose: ["5000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [qvnet]
    security_opt: ["no-new-privileges:true"]
    # Chromium (Puppeteer PDF invoices) needs a roomy /dev/shm; no read_only
    # because Chromium writes a temp profile to the container FS.
    shm_size: 512mb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }
        reservations: { cpus: "0.25", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ---------------------------------------------------------------------------
  nginx:
    image: ghcr.io/forgequantumsolution/quantumvorvex-uat-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Host nginx terminates TLS and proxies to this localhost port.
    ports:
      - "127.0.0.1:8002:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [qvnet]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
